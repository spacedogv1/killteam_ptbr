name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Instalar dependências
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Gerar versão do site
        working-directory: app
        env:
          GITHUB_PAGES: 'true'
        run: pnpm run build -- --prerender-all

      - name: Preparar arquivos publicados
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R app/dist/client/. _site/
          cp -R app/dist/client/killteam_ptbr/_next _site/_next
          cp app/dist/server/prerendered-routes/index.html _site/index.html
          cp app/dist/server/prerendered-routes/404.html _site/404.html
          touch _site/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
